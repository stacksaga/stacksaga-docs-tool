antora:
  extensions:
    - ./lib/adoc-publisher-extension.js
site:
  title: StackSaga Docs
  start_page: stacksaga::introduction-to-stacksaga.adoc
  url: https://docs.stacksaga.org
content:
  sources:
    - url: https://github.com/stacksaga/stacksaga-docs.git
      branches: main
      start_path: docs
#    - url: https://github.com/mafei-dev/stacksaga-admin-docs.git
#      branches: main
#      start_path: docs
ui:
  bundle:
    url: ./theme
  supplemental_files:
    - path: ui.yml
      contents: |
        static_files:
        - CNAME
        - ads.txt
        - sitemap.xml
    - path: CNAME
      contents: |
        docs.stacksaga.org
    - path: ads.txt
      contents: |
        google.com, pub-3193366757941154, DIRECT, f08c47fec0942fa0
    - path: sitemap.xml
      contents: |
        <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">

            <url>
                <loc>https://docs.stacksaga.org/</loc>
                <lastmod>2026-06-20T00:00:00+00:00</lastmod>
            </url>

            <url>
                <loc>https://docs.stacksaga.org/stacksaga/latest/introduction-to-stacksaga.html</loc>
                <lastmod>2026-06-20T00:00:00+00:00</lastmod>
            </url>

            <url>
                <loc>https://docs.stacksaga.org/stacksaga/latest/foundations/index.html</loc>
                <lastmod>2026-06-20T00:00:00+00:00</lastmod>
            </url>

            <url>
                <loc>https://docs.stacksaga.org/stacksaga/latest/implementations/stacksaga-sync/index.html</loc>
                <lastmod>2026-06-20T00:00:00+00:00</lastmod>
            </url>

            <url>
                <loc>https://docs.stacksaga.org/stacksaga/latest/implementations/stacksaga-kafka-implementation/index.html</loc>
                <lastmod>2026-06-20T00:00:00+00:00</lastmod>
            </url>

        </urlset>

asciidoc:
  extensions:
    - asciidoctor-plantuml
  attributes:
    plantuml-server-url: http://www.plantuml.com/plantuml
    page-pagination: '@'
    source-highlighter: highlight.js