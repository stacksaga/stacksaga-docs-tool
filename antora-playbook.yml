antora:
  extensions:
    - ./lib/adoc-publisher-extension.js
    - require: ./lib/sitemap-priority-extension.js
      include_root: true
      default_priority: 0.5
      default_changefreq: monthly
      rules:
        - match: /introduction-to-stacksaga.html
          priority: 1.0
          changefreq: weekly
        - match: /**/index.html
          priority: 0.8
          changefreq: weekly
        - match: /**/overview.html
          priority: 0.8
          changefreq: weekly
        - match: /**/architecture.html
          priority: 0.8
          changefreq: weekly
        - match: /foundations/**
          priority: 0.7
          changefreq: weekly
        - match: /static/**
          priority: 0.3
          changefreq: yearly
site:
  title: StackSaga Docs
  start_page: stacksaga::introduction-to-stacksaga.adoc
  url: https://docs.stacksaga.org
content:
  sources:
    - url: https://github.com/stacksaga/stacksaga-docs.git
      branches: main
      start_path: docs
ui:
  bundle:
    url: ./theme
  supplemental_files:
    - path: ui.yml
      contents: |
        static_files:
        - CNAME
        - ads.txt
    - path: CNAME
      contents: |
        docs.stacksaga.org
    - path: ads.txt
      contents: |
        google.com, pub-3193366757941154, DIRECT, f08c47fec0942fa0

asciidoc:
  extensions:
    - asciidoctor-plantuml
  attributes:
    plantuml-server-url: http://www.plantuml.com/plantuml
    page-pagination: '@'
    source-highlighter: highlight.js